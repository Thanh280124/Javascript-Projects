<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
     Words, Letters, and Spaces Counter
    </title>
    <link rel="stylesheet" href="styles.css" />
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
      <div class="container">
        <form action="">
          <label for="">Book Title</label>
          <input type="text" id="bookTitle" placeholder="Enter book title..." />
          <label for="">Author</label>
          <input type="text" id="author" placeholder="Enter author's name..." />  
          <label for="">Published Year</label>
          <input type="number" id="publishedYear" placeholder="Enter published year..." />
          <button type="submit" id="addBook">Add Book</button>
        </form>


        <table>
          <thead>
            <tr class="table">
              <th>Title</th>
              <th>Author</th>
              <th>Published Year</th>
            </tr>
          </thead>
          <tbody id="bookList">
          </tbody>
        </table>
      </div>
    <script src="index.js"></script>
  </body>
</html>
