<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User-Friendly Feedback</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   <div class="container">
        <div class="content1">
            <h2>Your Feedback 
            <span>
                <img src="wink.png" alt="" width="25px" height="25px">
            </span>
            </h2>

            <div class="img">
                <div class="div-img">
                    <img src="sad.png" alt="" width="100px" height="100px" class="icon">
                    <p class="emoji">Unhappy</p>
                </div>
                
                <div class="div-img">
                    <img src="neutral.png" alt="" width="100px" height="100px" class="icon">
                    <p class="emoji">Neutral</p>
                </div>
                
                <div class="div-img">
                    <img src="happy.png" alt="" width="100px" height="100px" class="icon">
                    <p class="emoji">Satisfied</p>
                </div>
            </div>

            <button class="btn">Send Feedback</button>
        </div>

        <div class="content2">
            <img src="love.png" alt="" width="70px" height="70px">
            <p class="thanks">Thank You for your Feedback</p>
            <p>Feedback: <span class="feedback"></span></p>
        </div>
   </div>
</body>
<script src="index.js"></script>
</html>
