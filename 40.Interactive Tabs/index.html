<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Tabs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   <div class="container">
       <div class="tab-buttons">
        <button data-tabs = '0' class="active">HTML</button>
        <button data-tabs = '1'>bro</button>
        <button data-tabs = '2'>code</button>
        <button data-tabs = '3'>low</button>
        <button data-tabs = '4'>How</button>
       </div>

       <div class="tab-content">
        <p class="tab active" id="tab-0">Lorem ipsum dolor, sit amet consectetur adipisicing elit...</p>
    <p class="tab" id="tab-1">amet consectetur adipisicing elit...</p>
    <p class="tab" id="tab-2">dolor, sit amet consectetur adipisicing elit...</p>
    <p class="tab" id="tab-3">ipsum dolor, sit amet consectetur adipisicing elit...</p>
    <p class="tab" id="tab-4">adipisicing elit...</p>
       </div>
   </div>
</body>
<script src="index.js"></script>
</html>
