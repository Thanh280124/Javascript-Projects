<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Animation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   <div class="container">
        <input type="text" inputmode="numeric" pattern="[0-9]*" />

     
          <div class="nums">
            <button class="gray">AC</button>
            <button class="gray">+/-</button>
            <button class="gray">%</button>
            <button class="orange">÷</button>
        </div>
        <div class="nums">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="orange">×</button>
        </div>
        <div class="nums">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="orange">-</button>
        </div>
        <div class="nums">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="orange">+</button>
        </div>
        <div class="nums">
            <button>00</button>
            <button>0</button>
            <button>,</button>
            <button class="orange">=</button>
        </div>

        
   </div>
</body>
<script src="index.js"></script>
</html>
