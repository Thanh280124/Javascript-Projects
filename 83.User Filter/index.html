<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
    User Filter
    </title>
    <link rel="stylesheet" href="styles.css" />
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
     <div class="container">
      <div class="header">
        <h1>Search by name and location</h1>
      <input type="text" id="searchInput" placeholder="Search by name or location" />
      </div>
      
      <div class="list-people">
        <div class="person" id="person1">
          <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="Person 1" />
          <div class="infor">
            <h2>John Doe</h2>
            <p>Location: New York, USA</p>
          </div>
        </div>

         <div class="person" id="person1">
          <img src="https://randomuser.me/api/portraits/men/76.jpg" alt="Person 1" />
          <div class="infor">
            <h2>John more</h2>
            <p>Location: New York, USA</p>
          </div>
        </div>

        <div class="person" id="person1">
          <img src="https://randomuser.me/api/portraits/men/77.jpg" alt="Person 1" />
          <div class="infor">
            <h2>John home</h2>
            <p>Location: New York, USA</p>
          </div>
        </div>
      </div>
     </div>

     <div class="toggle"></div>
    <script src="index.js"></script>
  </body>
</html>
