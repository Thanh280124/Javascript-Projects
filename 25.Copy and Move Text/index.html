<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy and Move Text </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="copy-container">
        <div class="btn-container">
            <button class="copybtn btn">Copy Text</button>
        </div>
        <textarea name="copytxt" cols="50" rows="3">Hello word</textarea>
    </div>

    <div class="move-container">
        <div class="output"></div>
        <button class="moveBtn btn">Move Text</button>
        <textarea name="finaltxt" cols="50" rows="3"></textarea>
    </div>
</body>
<script src="index.js"></script>
</html>
