<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Image Background</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    
    <section class="container">
      <div class="img active" style="background-image: url('hotels.jpg');"></div>
       <div class="img" style="background-image: url('hotels2.jpg');"></div>
       <div class="img" style="background-image: url('hotels3.jpg');"></div>
       <div class="img" style="background-image: url('hotels4.jpg');"></div>

       <button class="btn arrow-btn left-arrow">
          <p>&#x2190;</p>
       </button>
       <button class="btn arrow-btn right-arrow">
          <p>&#x2192;</p>
       </button>
    </section>

    <script src="index.js"></script>
  </body>
